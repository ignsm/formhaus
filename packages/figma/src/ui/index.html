<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>/* FORMHAUS_STYLES */</style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" data-tab="generate">Generate</button>
    <button class="tab" data-tab="components">Components</button>
    <button class="tab" data-tab="settings">JSON map</button>
  </div>

  <div class="tab-content active" id="tab-generate">
    <h2>Formhaus</h2>
    <fieldset class="components" id="components">
      <legend>Components</legend>
      <label class="choice"><input type="radio" name="source" value="kit"> Built-in kit
        <select id="kit">
          <option value="material">Material 3</option>
          <option value="ios">iOS-like</option>
        </select>
      </label>
      <label class="choice"><input type="radio" name="source" value="custom"> My components <span class="hint" id="customHint"></span></label>
    </fieldset>
    <label for="definition">Paste @formhaus/core form definition JSON</label>
    <textarea id="definition" placeholder='{ "id": "...", "title": "...", "submit": { "label": "Submit" }, "fields": [...] }'></textarea>
    <button class="link" id="loadExample">Load example (basic-form)</button>
    <button id="generate">Generate</button>
    <div class="output" id="output"></div>
  </div>

  <div class="tab-content" id="tab-components">
    <p class="hint">Select a component or a configured instance on the canvas, then click <b>Use selection</b>. Anything you leave unbound uses the built-in kit.</p>
    <button class="btn-secondary" id="autoMatch">Auto-match from this page</button>
    <div class="output" id="bindingsOutput"></div>
    <div class="bindings" id="bindings"></div>
  </div>

  <div class="tab-content" id="tab-settings">
    <div>
      <label>Status</label>
      <div class="status-row">
        <span class="status-badge default" id="mapStatus">Using default map</span>
      </div>
    </div>
    <label for="componentMap">Component Map JSON</label>
    <textarea id="componentMap" placeholder="Paste your component map JSON here..."></textarea>
    <p class="hint">Map your design system's Figma component keys to form field types. Load the current map to use it as a starting point.</p>
    <div class="btn-row">
      <button class="btn-secondary" id="loadCurrentMap">Load Current</button>
      <button id="saveMap">Save Map</button>
    </div>
    <button class="btn-danger" id="resetMap">Reset to Default</button>
    <div class="output" id="mapOutput"></div>
  </div>

  <script>/* FORMHAUS_SCRIPT */</script>
</body>
</html>
