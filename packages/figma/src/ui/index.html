<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>/* FORMHAUS_STYLES */</style>
</head>
<body>
  <header class="topbar">
    <nav class="segmented" role="tablist">
      <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="generate">Form</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="components">Components</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="settings">JSON map</button>
    </nav>
  </header>

  <section class="panel active" role="tabpanel" id="tab-generate">
    <div class="source-row">
      <label class="section-label" for="sourceSelect">Components</label>
      <select id="sourceSelect">
        <option value="kit:material">Material 3 kit</option>
        <option value="kit:ios">iOS-like kit</option>
        <option value="custom">My components</option>
      </select>
      <button class="link" id="openComponents" type="button">Set up</button>
    </div>
    <div class="form-bar">
      <div class="form-status-row">
        <div class="form-status" id="formStatus">New form</div>
        <button class="link" id="openCanvasForm" type="button" hidden>Open it</button>
      </div>
      <div class="segmented small">
        <button class="mode active" type="button" aria-pressed="true" data-mode="fields">Fields</button>
        <button class="mode" type="button" aria-pressed="false" data-mode="json">JSON</button>
      </div>
    </div>
    <div class="editor" id="editor"></div>
    <textarea id="definition" spellcheck="false" hidden></textarea>
    <div class="row-between">
      <button class="link" id="newForm" type="button">New form</button>
      <button class="link" id="loadExample" type="button">Load example</button>
    </div>
    <footer class="panel-footer">
      <div class="output" id="output"></div>
      <button class="btn btn-primary btn-block" id="generate" type="button">Generate form</button>
    </footer>
  </section>

  <section class="panel" role="tabpanel" id="tab-components">
    <div class="tray is-empty" id="tray"></div>
    <div class="coverage">
      <div class="row-between">
        <div class="coverage-title" id="coverageTitle"></div>
        <button class="btn btn-secondary btn-small" id="autoMatch" type="button">Auto-match</button>
      </div>
      <div class="coverage-bar" id="coverageBar"></div>
      <div class="coverage-legend" id="coverageLegend"></div>
    </div>
    <div class="output" id="bindingsOutput"></div>
    <div class="groups" id="bindings"></div>
    <p class="hint footnote">Drag a card onto the canvas to place that component.</p>
  </section>

  <section class="panel" role="tabpanel" id="tab-settings">
    <div class="row-between">
      <div class="section-label">Component map</div>
      <span class="badge tone-neutral" id="mapStatus">No custom map</span>
    </div>
    <p class="hint">The older way to use your own library: a JSON map of field types to component keys. It is used when My components is selected and nothing is bound in Components.</p>
    <textarea id="componentMap" spellcheck="false" placeholder="Paste your component map JSON"></textarea>
    <div class="output" id="mapOutput"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="loadCurrentMap" type="button">Load current</button>
      <button class="btn btn-secondary btn-danger" id="resetMap" type="button">Reset</button>
      <button class="btn btn-primary" id="saveMap" type="button">Save map</button>
    </div>
  </section>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Text slots"></div>

  <script>/* FORMHAUS_SCRIPT */</script>
</body>
</html>
