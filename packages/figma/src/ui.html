<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>/* FORMHAUS_STYLES */</style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" data-tab="generate">Generate</button>
    <button class="tab" data-tab="settings">Component Map</button>
  </div>

  <div class="tab-content active" id="tab-generate">
    <h2>Formhaus</h2>
    <label for="definition">Paste @formhaus/core form definition JSON</label>
    <textarea id="definition" placeholder='{ "id": "...", "title": "...", "submit": { "label": "Submit" }, "fields": [...] }'></textarea>
    <button class="link" id="loadExample">Load example (basic-form)</button>
    <button id="generate">Generate</button>
    <div class="output" id="output"></div>
  </div>

  <div class="tab-content" id="tab-settings">
    <div>
      <label>Status</label>
      <div class="status-row">
        <span class="status-badge default" id="mapStatus">Using default map</span>
      </div>
    </div>
    <label for="componentMap">Component Map JSON</label>
    <textarea id="componentMap" placeholder="Paste your component map JSON here..."></textarea>
    <p class="hint">Map your design system's Figma component keys to form field types. Load the current map to use it as a starting point.</p>
    <div class="btn-row">
      <button class="btn-secondary" id="loadCurrentMap">Load Current</button>
      <button id="saveMap">Save Map</button>
    </div>
    <button class="btn-danger" id="resetMap">Reset to Default</button>
    <div class="output" id="mapOutput"></div>
  </div>

  <script>/* FORMHAUS_SCRIPT */</script>
</body>
</html>
